services:
  - type: web
    name: task-manager-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run prisma:generate && npm run prisma:deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false
